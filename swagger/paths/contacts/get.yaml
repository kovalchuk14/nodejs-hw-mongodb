# swagger/paths/contacts/get.yaml
tags:
  - Contacts
summary: Get some contacts
operationId: getContacts
description: Get some contacts
security:
  - bearerAuth: []

parameters:
  - name: page
    in: query
    schema:
      type: integer
      example: 1
  - name: perPage
    in: query
    schema:
      type: integer
      example: 5
  - name: sortBy
    in: query
    schema:
      type: string
      enum:
        [
          '_id',
          'name',
          'phoneNumber',
          'email',
          'isFavourite',
          'contactType',
          'createdAt',
          'updatedAt',
        ]
      example: name
  - name: sortOrder
    in: query
    schema:
      type: string
      enum: ['asc', 'dsc']
      default: 'asc'
      example: desc
  - name: contactType
    in: query
    schema:
      type: string
      enum: ['work', 'home', 'personal']
      example: home
  - name: isFavourite
    in: query
    schema:
      type: boolean
      example: true

responses:
  '200':
    description: Successfully found contacts!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
            - page
            - perPage
            - totalItems
            - totalPages
            - hasNextPage
            - hasPreviousPage
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: array
              items:
                $ref: ../../components/schemas/contact.yaml
            page:
              type: number
              example: 1
            perPage:
              type: number
              example: 4
            totalItems:
              type: number
              example: 4
            totalPages:
              type: number
              example: 4
            hasNextPage:
              type: boolean
              example: true
            hasPreviousPage:
              type: boolean
              example: false

  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
