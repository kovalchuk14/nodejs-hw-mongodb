# swagger/paths/auth/register/post.yaml
tags:
  - Auth
summary: register user
operationId: registerAuth
description: register user
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            type: string
            description: user name
            example: Lord Tak
          email:
            type: string
            description: user email
            example: example@gmail.com
          password:
            type: string
            description: user password
            example: qwerty123

responses:
  '201':
    description: Successfully registered a user!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              $ref: ../../../components/schemas/user.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '409':
    description: email in use
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 409
            message:
              type: string
              example: email in use
  '500':
    $ref: ../../../components/responses/500.yaml
