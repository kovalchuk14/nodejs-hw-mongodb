# swagger/paths/auth/login/post.yaml
tags:
  - Auth
summary: Login user
operationId: LoginAuth
description: Login user
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            type: string
            description: user email
            example: example@gmail.com
          password:
            type: string
            description: user password
            example: '*********'

responses:
  '200':
    description: Successfully logged in an user!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: string
              description: accessToken
              example: Zssw12JSElW...
  '400':
    $ref: ../../../components/responses/400.yaml
  '401':
    description: User not found or Unautorized
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 401
            message:
              type: string
              example: Unautorized
  '500':
    $ref: ../../../components/responses/500.yaml
