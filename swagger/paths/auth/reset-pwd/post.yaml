tags:
  - Auth
summary: Reset user password
operationId: resetPassword
description: Resets the user's password using a valid reset token.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            type: string
            description: JWT reset token sent to the user's email.
            example: eyJhbGciOiJIUzI1NiIs...
          password:
            type: string
            format: password
            example: newSecurePassword123
responses:
  '200':
    description: Password has been successfully reset.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
            data:
              type: object
  '401':
    $ref: ../../../components/responses/401.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
