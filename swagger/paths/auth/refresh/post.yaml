# swagger/paths/auth/refresh/post.yaml
tags:
  - Auth
summary: Refresh user
operationId: RefreshAuth
description: Refresh user
security:
  - bearerAuth: []

responses:
  '200':
    description: Successfully refreshed a session!
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully refreshed a session!
            data:
              type: string
              description: accessToken
              example: Zssw12JSElWj2fwPgsOx2Sf...
  '400':
    $ref: ../../../components/responses/400.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
